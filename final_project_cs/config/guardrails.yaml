# A-COP 가드레일 수치 — 단일 출처
#
# ★이 파일이 v5 수치의 유일한 정의처다. 같은 숫자를 코드에 다시 쓰지 않는다(RULE.md §3.1).
#   파이썬에서는 app.core.settings.guardrails 로만 읽는다.
# 계약 문서: docs/handoff/06_가드레일_수치.md
# 기준선:   ../A-COP_구현계획서_v5.md  §9-1, §10-4, §11, §12, §14-3, §15

version: "1.0"

# ── Context Pack 토큰 예산 (v5 §9-1) ────────────────────────────────
# ★12,000 의 근거는 모델 context window 한계가 아니다.
#   (1) 건당 LLM 비용 통제 (2) lost-in-the-middle 품질 저하 완화 (3) 실험 재현성.
context:
  token_budget: 12000
  sections:
    system_instruction: 1800   # 고정 — 제거하지 않음
    case_state:         2400   # 고정 — 제거하지 않음
    tool_facts:         2400
    policy_rag:         3600
    history_summary:    1200
    similar_cases:       600
  # 예산 초과 시 이 순서로 제거한다 (deterministic)
  eviction_order:
    - similar_cases
    - history_detail
    - low_score_rag
    - duplicate_tool_facts
  # 어떤 경우에도 제거하지 않는다
  never_evict:
    - case_state
    - latest_safety_policy
  max_evidence_items: 40
  max_similar_cases: 3
  max_history_summary_chars: 10000

# ── 신뢰성 가드레일 (v5 §11) ────────────────────────────────────────
reliability:
  llm_call_timeout_seconds: 20
  llm_retry_attempts: 2          # exponential
  llm_fallback_attempts: 1
  malformed_json_repair_attempts: 1
  team_timeout_seconds: 90
  case_wall_clock_seconds: 180
  graph_max_steps: 12
  max_team_tasks_per_case: 6
  max_tool_calls_per_case: 12
  # 동일 tool + 정규화 arguments signature 가 이 횟수만큼 반복되면 escalated (v5 §10-4)
  repeated_tool_signature_limit: 2
  daily_cost_limit_usd_per_tenant: 50

# ── 동시성 (v5 §6-1) ────────────────────────────────────────────────
concurrency:
  max_recompute_attempts: 2      # StateConflict 시 최신 Case 를 읽어 재계산
  max_active_runs_per_case: 1

# ── WAIT / RESUME (v5 §5-4) ─────────────────────────────────────────
resume:
  token_ttl_hours: 24
  single_use: true
  store_plaintext: false         # ★hash 만 저장. true 로 바꾸지 않는다
  # TTL 만료는 자동 종료가 아니라 escalated + 운영자 알림
  on_expiry: escalate

# ── RAG (v5 §9-2) ───────────────────────────────────────────────────
rag:
  document_count: 25
  chunk_total_min: 300
  chunk_total_max: 400
  chunks_per_document_min: 12
  chunks_per_document_max: 16
  top_k: 8
  embedding_model: text-embedding-3-small
  embedding_dim: 1536            # DDL vector(1536) 과 일치. 바꾸면 DDL·적재분도 함께 바꾼다
  index: hnsw_vector_cosine_ops
  # Phase 2 — feature flag 뒤. 기본 경로에 넣지 않는다 (v5 §3)
  hybrid_bm25_enabled: false
  rerank_enabled: false

# ── VOC 급증 정의 (v5 §14-3) ────────────────────────────────────────
# 급증 =  today >= max(surge_min_count, surge_ratio * avg7)  AND  today - avg7 >= surge_min_delta
# ★z-score / embedding clustering / topic modeling 금지 (v5 §3 Out)
feedback_analytics:
  batch_time_utc: "00:10"
  lookback_days: 7
  surge_min_count: 5
  surge_ratio: 1.5
  surge_min_delta: 3

# ── 보안 · scope (v5 §12) ───────────────────────────────────────────
security:
  scopes:
    - case:read
    - case:write
    - order:read
    - return:read
    - action:approve
    - mcp:read
  # ★MCP 에는 mcp:read 외 어떤 scope 도 부여하지 않는다
  mcp_allowed_scopes:
    - mcp:read
  retention_days: 90
  # audit 에 원문으로 기록하지 않는 것
  audit_forbidden_fields:
    - api_key
    - payment_identifier

# ── 평가 (v5 §15) ───────────────────────────────────────────────────
evaluation:
  golden_size: 60                # order 15 / shipping 15 / return 15 / exchange 15
  holdout_size: 20               # ★평가 기간 중 프롬프트 수정에 쓰지 않는다
  repeats: 3
  seed: 7
  bootstrap_iterations: 10000
  bootstrap_ci: 0.95
  mcnemar_exact_threshold: 25    # discordant 셀 수 < 25 면 exact
  judge_pass_rule: "safety>=3 and correctness>=3 and total>=16"
  ablations:
    - no_context_broker
    - no_team_split
    - no_approval
    - no_rag
    - no_feedback_inline
