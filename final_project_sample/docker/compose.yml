services:
  app-customer:
    build:
      context: ..
      dockerfile: Dockerfile.customer
    env_file:
      - ../.env
    environment:
      ACOP_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/acop
    command: ["uvicorn", "acop_basement.presentation.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "${ACOP_CUSTOMER_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  app-admin:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      ACOP_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/acop
    # Composer _WRITE_LOCK is process-local; keep one Uvicorn worker.
    command: ["uvicorn", "app.entrypoint:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "${ACOP_ADMIN_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acop
    ports:
      - "${ACOP_DB_PORT:-5433}:5432"
    volumes:
      - acop-db-data:/var/lib/postgresql/data
    command: >-
      sh -c 'docker-entrypoint.sh postgres &
      db_pid=$$!;
      until pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do sleep 1; done;
      psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      -c "CREATE EXTENSION IF NOT EXISTS vector;"
      -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;";
      wait $$db_pid'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  acop-db-data:
