<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>쿠팡 주문내역 추출</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      body {
        box-sizing: border-box;
        width: 360px;
        margin: 0;
        padding: 18px;
        color: #1f2937;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 19px;
      }

      fieldset {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 0 0 14px;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
      }

      fieldset.scope {
        grid-template-columns: 1fr;
      }

      .scope label {
        display: flex;
        grid-column: 1 / -1;
        align-items: flex-start;
        gap: 8px;
      }

      .scope input {
        width: auto;
        margin-top: 2px;
      }

      .scope span {
        color: #6b7280;
      }

      legend {
        padding: 0 4px;
        font-size: 13px;
        font-weight: 600;
      }

      label {
        display: grid;
        gap: 5px;
        font-size: 12px;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 8px;
        border: 1px solid #9ca3af;
        border-radius: 6px;
        font: inherit;
      }

      .actions {
        display: grid;
        gap: 8px;
      }

      #scopeSummary {
        margin: 0 0 2px;
        padding: 10px;
        border: 1px solid #93c5fd;
        border-radius: 7px;
        color: #1e3a8a;
        background: #eff6ff;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.45;
      }

      button {
        padding: 10px 12px;
        border: 0;
        border-radius: 7px;
        color: #ffffff;
        background: #2563eb;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #047857;
      }

      button.stop {
        background: #b91c1c;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      #status {
        min-height: 44px;
        margin: 14px 0;
        padding: 10px;
        border-radius: 7px;
        background: #f3f4f6;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-line;
      }

      .help {
        margin: 12px 0 0;
        color: #6b7280;
        font-size: 11px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <h1>쿠팡 주문내역 추출</h1>

    <fieldset class="scope">
      <legend>수집 범위</legend>
      <label>
        <input type="radio" name="collectionScope" value="list">
        <strong>목록만</strong> <span>빠름</span>
      </label>
      <label>
        <input type="radio" name="collectionScope" value="detail">
        <strong>목록 + 상세</strong> <span>주문번호·결제정보 포함</span>
      </label>
      <label>
        <input type="radio" name="collectionScope" value="tracking" checked>
        <strong>목록 + 상세 + 배송조회</strong> <span>배송 이력 포함, 가장 느림</span>
      </label>
    </fieldset>

    <fieldset class="scope">
      <legend>연도 범위</legend>
      <label>
        <input type="radio" name="yearScope" value="current" checked>
        <strong>다음 버튼으로 끝까지</strong>
        <span class="help">연도 탭을 건드리지 않는다. 다음만 눌러도 지난 연도까지 나온다.</span>
      </label>
      <label>
        <input type="radio" name="yearScope" value="all">
        <strong>연도 탭을 하나씩</strong>
        <span class="help">위로 끝까지 갔는데 빠진 해가 있을 때만 쓴다.</span>
      </label>
    </fieldset>

    <fieldset>
      <legend>페이지·주문 사이 대기 시간</legend>
      <label>
        최소 초
        <input id="minDelay" type="number" min="0.8" step="0.1" value="1.5" inputmode="decimal">
      </label>
      <label>
        최대 초
        <input id="maxDelay" type="number" min="0.8" step="0.1" value="3.5" inputmode="decimal">
      </label>
    </fieldset>

    <div class="actions">
      <p id="scopeSummary">수집 범위: 목록 + 상세 + 배송조회 (가장 느림)</p>
      <button id="startButton" type="button">수집 시작</button>
      <button id="stopButton" class="stop" type="button" disabled>중단</button>
      <button id="stateProbeButton" type="button">지금 상태</button>
      <button id="detailProbeButton" type="button">상세 열기 시험</button>
      <button id="diagnoseButton" type="button">구조 진단</button>
      <button id="orderDownloadButton" class="secondary" type="button" disabled>주문 JSON 내려받기</button>
      <button id="trackingDownloadButton" class="secondary" type="button" disabled>배송 JSON 내려받기</button>
    </div>

    <p id="trackingDownloadReason" class="help">수집 전에는 배송 JSON을 내려받을 수 없습니다.</p>

    <p id="buildLine" class="help"></p>
    <div id="status" role="status" aria-live="polite">주문목록 페이지에서 수집을 시작하세요.</div>

    <p class="help">0건이면 구조 진단으로 선택자 매칭 수를 확인하세요. 결과는 외부 서버로 전송하지 않습니다.</p>

    <script src="content.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
