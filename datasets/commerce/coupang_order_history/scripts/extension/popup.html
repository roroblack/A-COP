<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>쿠팡 주문내역 추출</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      body {
        box-sizing: border-box;
        width: 360px;
        margin: 0;
        padding: 18px;
        color: #1f2937;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 19px;
      }

      fieldset {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 0 0 14px;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
      }

      legend {
        padding: 0 4px;
        font-size: 13px;
        font-weight: 600;
      }

      label {
        display: grid;
        gap: 5px;
        font-size: 12px;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 8px;
        border: 1px solid #9ca3af;
        border-radius: 6px;
        font: inherit;
      }

      .actions {
        display: grid;
        gap: 8px;
      }

      button {
        padding: 10px 12px;
        border: 0;
        border-radius: 7px;
        color: #ffffff;
        background: #2563eb;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #047857;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      #status {
        min-height: 44px;
        margin: 14px 0;
        padding: 10px;
        border-radius: 7px;
        background: #f3f4f6;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-line;
      }

      .help {
        margin: 12px 0 0;
        color: #6b7280;
        font-size: 11px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <h1>쿠팡 주문내역 추출</h1>

    <fieldset>
      <legend>페이지 사이 대기 시간</legend>
      <label>
        최소 초
        <input id="minDelay" type="number" min="0.8" step="0.1" value="1.5" inputmode="decimal">
      </label>
      <label>
        최대 초
        <input id="maxDelay" type="number" min="0.8" step="0.1" value="3.5" inputmode="decimal">
      </label>
    </fieldset>

    <div class="actions">
      <button id="startButton" type="button">수집 시작</button>
      <button id="diagnoseButton" type="button">구조 진단</button>
      <button id="downloadButton" class="secondary" type="button" disabled>JSON 내려받기</button>
    </div>

    <div id="status" role="status" aria-live="polite">주문목록 페이지에서 수집을 시작하세요.</div>

    <p class="help">0건이면 구조 진단으로 선택자 매칭 수를 확인하세요. 결과는 외부 서버로 전송하지 않습니다.</p>

    <script src="popup.js"></script>
  </body>
</html>
