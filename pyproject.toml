[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "final-project-sample"
version = "0.3.0"
description = "A-COP S-API product (acop_basement/acop_composer packages + local domain modules)"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "httpx",
  "pydantic>=2",
  "PyYAML",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*", "acop_basement*", "acop_composer*"]
# ★packages/ 는 별도 배포 단위다(예: packages/acop_composer_ui — UI 가 pip 로
#   설치하는 클라이언트). 여기 include 되면 UI 용 패키지가 제품 배포판에
#   딸려 들어가고, "따로 설치한다" 는 전제가 깨진다.
exclude = ["tests*", "docs*", "eval*", "knowledge*", "packages*"]
