[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "final-project-sample"
version = "0.3.0"
description = "A-COP S-API product (acop_basement/acop_composer packages + local domain modules)"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "httpx",
  "pydantic>=2",
  "PyYAML",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*", "acop_basement*", "acop_composer*"]
exclude = ["tests*", "docs*", "eval*", "knowledge*"]
