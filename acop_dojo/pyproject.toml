[project]
name = "acop-dojo"
version = "0.1.0"
description = "A-COP 코드베이스를 실행 증거로 배우는 학습 엔진"
requires-python = ">=3.12"
dependencies = ["pytest>=8"]

[project.scripts]
acop-dojo = "acop_dojo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["acop_dojo*"]

[tool.setuptools.package-data]
acop_dojo = ["data/*.json", "defects/*.json", "defects/patches/*.patch"]
